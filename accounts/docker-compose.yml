services:
  accounts:
    image: "devarifkhan/accounts:s4"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - arifbank
  loans:
    image: "devarifkhan/loans:s4"
    container_name: loans-ms
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - arifbank
  cards:
    image: "devarifkhan/cards:s4"
    container_name: cards-ms
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - arifbank
networks:
  arifbank:
    driver: "bridge"